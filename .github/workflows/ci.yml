name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Nothing here writes to the repository, so the token is read-only whatever the repository default is.
permissions:
  contents: read

jobs:
  test-backend:
    name: Backend tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The backend tests run on temporary SQLite files, so none of them needs Docker.
      # -x generateJooq uses the committed jOOQ sources; it only applies to :app's task graph.
      - name: Run backend tests
        run: ./gradlew :app:test :decoder-simulator:test :decoder-protocol:test -x generateJooq

  test-frontend:
    name: Frontend tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --run
        working-directory: frontend

  test-e2e:
    name: E2E tests (Playwright, demo data and simulator)
    # ubuntu-latest is now 26.04, which Playwright does not support yet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The same jar the installers package: the UI is served by the app itself
      - name: Build the app with the UI inside
        run: ./gradlew -PbundleFrontend :app:bootJar -x generateJooq

      - name: Start the app with the demo club, and the simulator
        run: |
          RCTIMING_DATA_DIR="$RUNNER_TEMP/e2e-data" nohup java -jar app/build/libs/app.jar \
            --spring.profiles.active=demo --tts.enabled=false > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          nohup java -jar app/build/libs/app.jar simulate > "$RUNNER_TEMP/simulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/simulator.pid"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/about > /dev/null; then
              echo "App is ready after ${i} attempts"
              exit 0
            fi
            sleep 3
          done
          echo "App did not become ready in time"
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8080

      - name: Show the app log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/app.log"; tail -20 "$RUNNER_TEMP/simulator.log"

      - name: Stop the app and the simulator
        if: always()
        run: |
          for pid_file in "$RUNNER_TEMP/app.pid" "$RUNNER_TEMP/simulator.pid"; do
            if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" 2>/dev/null || true; fi
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
