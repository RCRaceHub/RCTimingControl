name: Javadoc

# Builds the developer Javadoc on every change to the code and fails on a malformed comment or a broken {@link}
# (doclint, set up in app/build.gradle.kts). On main it also keeps the result as a downloadable build artifact.

on:
  push:
    branches: ['**']
    paths:
      - 'app/src/main/java/**'
      - 'decoder-protocol/src/main/**'
      - 'decoder-simulator/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/javadoc.yml'
  pull_request:
    paths:
      - 'app/src/main/java/**'
      - 'decoder-protocol/src/main/**'
      - 'decoder-simulator/src/main/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/javadoc.yml'
  workflow_dispatch:

jobs:
  javadoc:
    name: Javadoc (doclint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # -x generateJooq uses the committed jOOQ sources, which the Javadoc leaves out
      - name: Build the Javadoc
        run: ./gradlew :app:javadoc -x generateJooq

      - name: Keep the Javadoc
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: app/build/docs/javadoc
          retention-days: 30
