name: Installers

# Builds the Windows, macOS and Linux installers (#23), installs each on a clean runner, checks the
# service comes up and serves the UI, then installs a newer version over it and checks the data
# survived. The installers are kept as workflow artifacts, and a v* tag attaches them to its
# GitHub release, which is how the app is published (#24).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'app/packaging/**'
      - 'app/build.gradle.kts'
      - 'scripts/installer-smoke.sh'
      - '.github/workflows/installers.yml'

permissions:
  contents: read

jobs:
  installer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux installer (deb)
            os: ubuntu-24.04
            artifact: installer-linux-amd64
          # Raspberry Pi 4 and 5, and ARM laptops; jpackage builds for the machine it runs on
          - name: Linux ARM installer (deb)
            os: ubuntu-24.04-arm
            artifact: installer-linux-arm64
          - name: macOS installer (pkg)
            os: macos-14
            artifact: installer-macos
          # windows-2022 has the WiX 3 toolset jpackage needs
          - name: Windows installer (msi)
            os: windows-2022
            artifact: installer-windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install fakeroot (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      # jpackage registers the Windows service through NSSM, pinned by checksum
      - name: Fetch NSSM (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sSfL --retry 3 -o nssm.zip https://nssm.cc/release/nssm-2.24.zip
          sha256sum nssm.zip
          echo "727d1e42275c605e0f04aba98095c38a8e1e46def453cdffce42869428aa6743  nssm.zip" | sha256sum -c -
          unzip -q nssm.zip
          echo "RCTIMING_SERVICE_INSTALLER=$(cygpath -w "$PWD/nssm-2.24/win64/nssm.exe")" >> "$GITHUB_ENV"

      # The same code at a lower version number stands in for the release being upgraded from
      - name: Build the older installer
        run: |
          ./gradlew -PbundleFrontend -PinstallerVersion=0.0.1 :app:installer -x generateJooq --no-daemon
          mkdir -p older && mv app/build/installer/out/* older/

      - name: Build the installer
        run: |
          ./gradlew -PbundleFrontend :app:installer -x generateJooq --no-daemon
          mkdir -p newer && mv app/build/installer/out/* newer/
          ls -l older newer

      - name: Install the older package
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y ./older/*.deb
          else
            sudo installer -pkg older/*.pkg -target /
          fi
      - name: Install the older package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem older/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install-older.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install-older.log -Tail 50; exit $p.ExitCode }

      - name: Check the fresh install
        run: scripts/installer-smoke.sh fresh

      - name: Install the newer package over it
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y ./newer/*.deb
          else
            sudo installer -pkg newer/*.pkg -target /
          fi
      - name: Install the newer package over it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem newer/*.msi).FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install-newer.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install-newer.log -Tail 50; exit $p.ExitCode }

      - name: Check the upgrade kept the data
        run: scripts/installer-smoke.sh upgraded

      - name: Check the service starts on boot
        run: |
          case "$RUNNER_OS" in
            Linux)
              systemctl is-enabled rctimingcontrol-RCTimingControl
              pid=$(systemctl show -p MainPID --value rctimingcontrol-RCTimingControl)
              user=$(ps -o user= -p "$pid")
              echo "Service runs as $user"
              test "$user" = rctiming ;;
            macOS)   sudo launchctl print system/dev.monkeypatch.rctiming-RCTimingControl | grep -E 'state|path' ;;
            Windows)
              start_type=$(powershell -NoProfile -Command "(Get-Service RCTimingControl).StartType" | tr -d '\r')
              echo "Service start type: $start_type"
              test "$start_type" = Automatic ;;
          esac

      - name: Check the sign-in key is private
        run: |
          case "$RUNNER_OS" in
            Linux)   test "$(sudo stat -c %a /var/lib/rctimingcontrol/jwt-secret)" = 600 ;;
            macOS)   test "$(sudo stat -f %Lp "/Library/Application Support/RCTimingControl/jwt-secret")" = 600 ;;
            Windows)
              acl=$(icacls 'C:\ProgramData\RCTimingControl\jwt-secret' | tr -d '\r')
              echo "$acl"
              if echo "$acl" | grep -Eqi 'Users|Everyone'; then exit 1; fi ;;
          esac

      - name: Check a restore keeps the service working (Linux)
        if: runner.os == 'Linux'
        run: |
          token=$(curl -sf -X POST http://localhost:8080/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-test-password"}' | jq -r .accessToken)
          name=$(curl -sf -X POST http://localhost:8080/api/v1/admin/backups -H "Authorization: Bearer $token" | jq -r .name)
          sudo systemctl stop rctimingcontrol-RCTimingControl
          sudo /opt/rctimingcontrol/bin/RCTimingControl restore "/var/lib/rctimingcontrol/backups/$name"
          test "$(sudo stat -c %U /var/lib/rctimingcontrol/rctiming.db)" = rctiming
          sudo systemctl start rctimingcontrol-RCTimingControl
          scripts/installer-smoke.sh upgraded

      - name: Check other devices are let through the firewall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rule = netsh advfirewall firewall show rule name="RC Timing Control" verbose | Out-String
          $rule
          if ($rule -notmatch 'RCTimingControl\.exe') { exit 1 }

      - name: Show the service log
        if: failure()
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo journalctl -u rctimingcontrol-RCTimingControl --no-pager | tail -100 ;;
            macOS)   sudo tail -100 "/Library/Application Support/RCTimingControl/logs/rctiming.log" ;;
            Windows) tail -100 "C:/ProgramData/RCTimingControl/logs/rctiming.log" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: newer/*
          if-no-files-found: error

  release:
    name: Attach the installers to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: installers/*
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          body: |
            Download the installer for the venue laptop:

            | System | File |
            |--------|------|
            | Windows 10 or 11 (64-bit) | the `.msi` |
            | macOS 12 or later | the `.pkg` |
            | Ubuntu or another Debian-based Linux | the `.deb`, or install with `apt` from the repository in the install guide |

            It installs RC Timing Control as a service that starts with the computer. Then open http://localhost:8080 to set up the club. See the [install guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/installing.md) for each system, and [trying it out](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/trial-quickstart.md) to explore it with a demo club and a simulated decoder.

  # Publishes the .deb files as a signed apt repository on GitHub Pages, so Linux laptops install
  # and upgrade with apt. Does nothing until the APT_GPG_KEY secret holds a passphrase-less signing
  # key and Pages is set to deploy from GitHub Actions (see the local releasing notes). Deployed as
  # a Pages artifact, not committed, so the 100 MB packages never enter git history.
  apt-repo:
    name: Publish the apt repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency: apt-repo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check the signing key is set
        id: key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          if [ -n "$APT_GPG_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"; else echo "::notice::APT_GPG_KEY is not set, so the apt repository was not published"; fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.set == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: steps.key.outputs.set == 'true'
        with:
          pattern: installer-linux-*
          path: installers
          merge-multiple: true

      # `testing` carries this tag, whatever it is. `stable` carries this tag when it is a final
      # release (the same rule the release job uses for pre-releases), and otherwise the newest
      # final release already published, so an alpha never replaces what stable users get.
      - name: Pick the packages for each channel
        if: steps.key.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p testing stable
          cp installers/*.deb testing/
          if [[ "$GITHUB_REF_NAME" == *-* || "$GITHUB_REF_NAME" == v0.* ]]; then
            # The carried-over release may predate arm64, so stable is not held to every architecture
            echo "APT_LENIENT_SUITES=stable" >> "$GITHUB_ENV"
            last=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -z "$last" ]; then
              echo "::notice::No final release yet, so the stable channel is empty"
            elif ! gh release download "$last" --repo "$GITHUB_REPOSITORY" --pattern 'rctimingcontrol_*.deb' --dir stable; then
              echo "::warning::Release $last has no packages, so the stable channel is empty"
            fi
          else
            cp installers/*.deb stable/
          fi
          ls -l testing stable

      - name: Build the repository
        if: steps.key.outputs.set == 'true'
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y reprepro
          echo "$APT_GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          scripts/build-apt-repo.sh "$RUNNER_TEMP/site" "$key" stable=stable testing=testing
          mkdir -p site-out && cp -r "$RUNNER_TEMP/site" site-out/apt

      - name: Check apt accepts it and sees the package
        if: steps.key.outputs.set == 'true'
        run: |
          site="$RUNNER_TEMP/site"
          expected=$(dpkg-deb -f testing/*_amd64.deb Version)
          echo "deb [signed-by=$site/rctc-archive-keyring.gpg] file://$site testing main" | sudo tee /etc/apt/sources.list.d/rctc-test.list
          sudo apt-get update
          apt-cache policy rctimingcontrol | tee /dev/stderr | grep -q "Candidate: $expected"
          # The stable channel must also be a valid signed repository, even when it is empty
          echo "deb [signed-by=$site/rctc-archive-keyring.gpg] file://$site stable main" | sudo tee /etc/apt/sources.list.d/rctc-test.list
          sudo apt-get update
          if ls stable/*_amd64.deb >/dev/null 2>&1; then
            apt-cache policy rctimingcontrol | grep -q "Candidate: $(dpkg-deb -f stable/*_amd64.deb Version)"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.key.outputs.set == 'true'
        with:
          path: site-out

      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.key.outputs.set == 'true'
