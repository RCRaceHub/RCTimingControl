version: 2
updates:
  # 1. Gradle Build Dependencies (Plugins and Libraries)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Groups minor and patch updates together to prevent PR noise
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. GitHub Actions Workflow Updates (Optional but recommended)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
