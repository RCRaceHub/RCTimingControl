# RC Timing Control: example first-start settings (skips the setup wizard)
#
# How to use it:
#   - Installed app: copy this file to the data folder as `application.properties`
#     (or add these lines to the one already there), then start the service.
#   - Docker: mount it, e.g. `./rctiming.properties:/data/application.properties:ro`
#     with `RCTIMING_DATA_DIR=/data`, or set the same names as environment variables
#     (RCTIMING_PROVISIONING_ADMIN_EMAIL and so on, see docs/provisioning.md).
#
# It is applied ONLY on a first start, while the database has no accounts. After that
# it is ignored, so it never changes a club that is already set up.
# Remove the password from this file once the app has started.

# ---- First admin (required; setting the email switches provisioning on) -------------
rctiming.provisioning.admin.email=admin@example.club
rctiming.provisioning.admin.first-name=Ann
rctiming.provisioning.admin.last-name=Admin
# At least 8 characters. Prefer RCTIMING_PROVISIONING_ADMIN_PASSWORD in the environment
# over writing it here.
rctiming.provisioning.admin.password=change-me-now

# ---- Club details (optional; leave club.name out to do this step in the wizard) ------
rctiming.provisioning.club.name=Example RC Club
# An IANA time zone id, e.g. Europe/London. Default: UTC
rctiming.provisioning.club.timezone=Europe/London
rctiming.provisioning.club.email=info@example.club
rctiming.provisioning.club.phone=
rctiming.provisioning.club.website-url=https://example.club

# ---- Decoder (optional; needs club.name, as the address is kept in the club details) -
# The AMB/MyLaps decoder on the venue network. Leave host out to set it later.
rctiming.provisioning.decoder.host=192.168.1.20
# Default: 5100
rctiming.provisioning.decoder.port=5100
# RC4 (the text protocol, firmware before 4.5) is the default
rctiming.provisioning.decoder.protocol=RC4

# ---- Other settings you may want on the same first start -----------------------------
# The club's key for RaceHub (entries in, results out)
#rctiming.racehub.token=
# The port the app listens on. Default: 8080
#server.port=8080
