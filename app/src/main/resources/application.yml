spring:
  web:
    resources:
      # SpaConfig serves the bundled frontend instead of Boot's default static mapping
      add-mappings: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # Logo uploads allow 2 MB; Boot's default of 1 MB refused them before the service's own check
      max-file-size: 2MB
      max-request-size: 3MB
  task:
    scheduling:
      # The scheduled jobs (decoder check, announcements, results export, backup, entry feed) share these
      # threads. Boot's default of one lets a slow RaceHub or a long backup hold up the rest.
      pool:
        size: 3

rctiming:
  database:
    # The database the app runs on. DatabaseConfig applies it to the connection pools, Flyway
    # and jOOQ.
    vendor: sqlite
    # Folder holding the database file. Unset, it is the per-user app-data folder.
    data-directory: ${RCTIMING_DATA_DIR:}
  entry-feed:
    # How often events with automatic entry fetch turned on pull their entry file, in milliseconds.
    interval-ms: 300000

app:
  jwt:
    # Base64 signing key for sign-in tokens. Unset, a random key is created in the data folder
    # (jwt-secret) on first start and reused after that.
    secret: ${JWT_SECRET:}
    access-token-ttl-ms: 900000
    refresh-token-ttl-ms: 604800000
  decoder:
    listener:
      # Read the AMB decoder over TCP. Set to false to turn off live timing ingest.
      enabled: ${DECODER_LISTENER_ENABLED:true}

storage:
  # Folder for uploads (club logo, announcer clips). Unset, it is an uploads folder beside the database.
  local-path: ${STORAGE_LOCAL_PATH:}
  # Relative by default, so logos load on whichever address a phone or board opened the app with
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:/storage}

tts:
  endpoint: ${TTS_ENDPOINT:piper:10200}
  defaultVoice: ${TTS_DEFAULT_VOICE:en_GB-alan-medium}
  enabled: ${TTS_ENABLED:true}
  # Piper locale prefixes to show in the voice picker (e.g. en_GB, en_US).
  # Leave empty to auto-detect from the JVM system locale.
  locales: ${TTS_LOCALES:}
