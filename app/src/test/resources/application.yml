spring:
  flyway:
    enabled: true

rctiming:
  retention:
    run-on-startup: false
  database:
    migration-locations: db/migration, db/testdata

app:
  jwt:
    secret: dGhpcyBpcyBhIHRlc3Qgc2VjcmV0IGtleSBmb3IgdGVzdHMgdGhhdCBpcyBsb25nIGVub3VnaA==
    access-token-ttl-ms: 900000
    refresh-token-ttl-ms: 604800000

# Default storage path for tests that don't exercise upload behavior directly. Tests that do
# (ClubLogoUploadIT) override storage.local-path via @DynamicPropertySource with a JUnit @TempDir
# so each test run writes to its own throwaway directory.
storage:
  local-path: ./build/test-uploads
  public-base-url: http://localhost:8080/storage
